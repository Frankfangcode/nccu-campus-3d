 $('#grid').innerHTML=L.length?L.map((o,i)=>{const d=o.d,k=key(d);return`<div class="card${o.e.s==='fail'?' dim':''}" tabindex="0" data-i="${D.indexOf(d)}"><button class="heart${S.fav.has(k)?' on':''}" data-k="${esc(k)}" aria-label="加入最愛">${S.fav.has(k)?'♥':'♡'}</button><h3>${esc(d.n)}</h3><div class="en">${esc(d.e)}</div><div><span class="tag">${esc(d.c)}</span> <span class="tag">${esc(d.l)}</span> <span class="tag">${esc(d.g)}</span> <span class="tag">名額 ${esc(d.q)}</span></div><p class="req">${esc(reqText(d))}</p><span class="st ${o.e.s}">${esc(o.e.t)}</span></div>`}).join(''):'<div class="empty">沒有符合的學校。試著放寬語組、身分，或取消「隱藏未達標」。</div>';
 return L}
let vb=VB['全世界'].slice(),raf;
function zoom(n){const to=VB[n],from=vb.slice(),t0=performance.now();cancelAnimationFrame(raf);
 const step=t=>{const p=Math.min(1,(t-t0)/600),e=1-Math.pow(1-p,3);vb=from.map((v,i)=>v+(to[i]-v)*e);$('#map').setAttribute('viewBox',vb.join(' '));if(p<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
function drawMap(b){const cnt={},ok={};D.forEach(d=>{if(S.lang.has(d.g))cnt[d.c]=(cnt[d.c]||0)+1});
 b.forEach(o=>{if(o.e.s!=='fail')ok[o.d.c]=(ok[o.d.c]||0)+1});
 let h='';for(let x=0;x<=1000;x+=83.3)h+=`<line class="grat" x1="${x}" x2="${x}" y1="0" y2="500"/>`;for(let y=0;y<=500;y+=55)h+=`<line class="grat" y1="${y}" y2="${y}" x1="0" x2="1000"/>`;
 LAND.forEach(p=>h+=`<polygon class="land" points="${p.map(c=>X(c[0])+','+Y(c[1])).join(' ')}"/>`);
 const zoomed=vb[2]<600;
 Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).forEach(c=>{const v=CT[c];if(!v)return;const r=Math.sqrt(cnt[c])*(zoomed?2.6:2.2)+3,g=ok[c]>0,sel=S.country===c;
  h+=`<g class="bub" data-c="${c}" tabindex="0" role="button" aria-label="${c} ${cnt[c]} 筆"><circle cx="${X(v[1])}" cy="${Y(v[0])}" r="${r}" fill="${g?'#ffc94d':'#5c8aa0'}" fill-opacity="${g?.85:.6}" stroke="${sel?'#fff':'none'}" stroke-width="3"/>${(zoomed||cnt[c]>=9||sel)?`<text x="${X(v[1])}" y="${Y(v[0])-r-3}">${c}</text>`:''}</g>`});
 $('#map').innerHTML=h}
function tabs(){$('#mtabs').innerHTML=Object.keys(VB).map(n=>`<button class="chip" data-n="${n}" aria-pressed="${S.cont===n&&!S.country}">${n}</button>`).join('')}
$('#mtabs').onclick=e=>{const n=e.target.dataset.n;if(!n)return;S.cont=n;S.country=null;zoom(n);tabs();render()};
function pickC(c){S.country=S.country===c?null:c;if(S.country){S.cont=CT[c][2];if(vb[2]>600)zoom(S.cont)}tabs();render();if(S.country)$('#ttl').scrollIntoView({behavior:'smooth',block:'start'})}
$('#map').onclick=e=>{const g=e.target.closest('.bub');if(g)pickC(g.dataset.c)};
$('#map').onkeydown=e=>{if(e.key==='Enter'){const g=e.target.closest('.bub');if(g)pickC(g.dataset.c)}};
$('#langs').innerHTML=[...new Set(D.map(d=>d.g))].map(g=>`<button class="chip" data-g="${g}" aria-pressed="${S.lang.has(g)}">${g}</button>`).join('');
$('#langs').onclick=e=>{const g=e.target.dataset.g;if(!g)return;S.lang.has(g)?S.lang.delete(g):S.lang.add(g);e.target.setAttribute('aria-pressed',S.lang.has(g));render()};
$('#hideFail').onclick=e=>{S.hf=!S.hf;e.target.setAttribute('aria-pressed',S.hf);render()};
$('#favBtn').onclick=()=>{S.fo=!S.fo;render()};
['toefl','ielts','gpa','lvl','q'].forEach(i=>$('#'+i).addEventListener('input',render));
function tog(k){S.fav.has(k)?S.fav.delete(k):S.fav.add(k);save();render()}
$('#grid').onclick=e=>{const h=e.target.closest('.heart');if(h){e.stopPropagation();return tog(h.dataset.k)}const c=e.target.closest('.card');if(c)detail(D[c.dataset.i])};
$('#grid').onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))detail(D[e.target.dataset.i])};
function detail(d){const o=ev(d),k=key(d),g=s=>'https://www.google.com/search?q='+encodeURIComponent(s),en=d.e;
 $('#dgc').innerHTML=`<button class="x" onclick="dlg.close()" aria-label="關閉">×</button><h2>${esc(d.n)}</h2><div class="en">${esc(d.e)}</div><p><span class="st ${o.s}">${esc(o.t)}</span></p><dl><dt>國家</dt><dd>${esc(d.c)}</dd><dt>身分</dt><dd>${esc(d.l)}　${esc(d.qual)}</dd><dt>語組</dt><dd>${esc(d.g)}</dd><dt>語言與 GPA</dt><dd>${esc(d.r)}</dd>${d.nt2?`<dt>新制托福</dt><dd>${esc(d.nt2)}</dd>`:''}<dt>名額</dt><dd>${esc(d.q)}</dd><dt>交換期程</dt><dd>${esc(d.p)}</dd><dt>獎學金</dt><dd>${esc(d.sc||'清單未列，請查國合處頁面')}</dd><dt>備註</dt><dd>${esc(d.nt||'無')}</dd></dl>
 <div class="links"><a class="btn" target="_blank" rel="noopener" href="${g(en+' official website')}">學校官網</a><a class="btn alt" target="_blank" rel="noopener" href="https://oic.nccu.edu.tw/ContractSchool">政大國合處</a><a class="btn alt" target="_blank" rel="noopener" href="${g(en+' exchange students scholarship')}">獎學金</a><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/travel/flights?q=${encodeURIComponent('Flights from Taipei to '+en)}">機票</a><a class="btn alt" target="_blank" rel="noopener" href="https://www.booking.com/searchresults.html?ss=${encodeURIComponent(en)}">住宿</a><a class="btn alt" target="_blank" rel="noopener" href="${g(en+' 旅遊 景點 生活')}">旅遊規劃</a><button class="btn ${S.fav.has(k)?'gold':'alt'}" id="df">${S.fav.has(k)?'♥ 已收藏':'♡ 加入最愛'}</button></div>`;
 $('#df').onclick=()=>{tog(k);detail(d)};dlg.showModal()}
let pool=[],rot=0;
$('#spin').onclick=()=>{const L=render().filter(o=>!['fail','lang'].includes(o.e.s));pool=L.sort(()=>Math.random()-.5).slice(0,8).map(o=>o.d);$('#wr').textContent='';draw();wd.showModal()};
function draw(){const c=$('#cv'),x=c.getContext('2d'),n=pool.length||1,a=2*Math.PI/n,col=['#ffc94d','#46d6b0','#58a6ff','#ff7a90','#b49cff','#ffa24d','#6fe3ff','#c4e86a'];x.clearRect(0,0,640,640);
 for(let i=0;i<n;i++){x.beginPath();x.moveTo(320,320);x.arc(320,320,310,i*a-Math.PI/2,(i+1)*a-Math.PI/2);x.fillStyle=col[i];x.fill();x.save();x.translate(320,320);x.rotate((i+.5)*a-Math.PI/2);x.fillStyle='#12303d';x.font='700 26px "Noto Sans TC",sans-serif';x.textAlign='right';const t=pool[i]?pool[i].n:'沒有符合的學校';x.fillText(t.length>9?t.slice(0,9)+'…':t,290,9);x.restore()}
 x.beginPath();x.arc(320,320,34,0,7);x.fillStyle='#fff';x.fill()}
$('#go').onclick=()=>{if(!pool.length)return;const n=pool.length,w=Math.floor(Math.random()*n),seg=360/n,cv=$('#cv');rot+=360*5+((360-(w+.5)*seg)-(rot%360)+360)%360;cv.style.transform=`rotate(${rot}deg)`;$('#wr').textContent='';
 setTimeout(()=>{$('#wr').innerHTML=`${esc(pool[w].c)}　<a href="#" id="wl" style="color:inherit">${esc(pool[w].n)}</a>`;$('#wl').onclick=ev=>{ev.preventDefault();wd.close();detail(pool[w])}},4300)};
tabs();render();
</script></body></html>
